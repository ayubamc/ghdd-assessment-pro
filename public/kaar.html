<!doctype html>
<html lang="so">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xaqiijinta Kaarka – GHDD</title>
<meta name="theme-color" content="#1c5cab">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
  <div class="wrap"><div class="brand"><div class="seal">GHDD</div><div><b>Xaqiijinta Kaarka Imtixaanka</b><small>Passcard verification</small></div></div></div>
</header>
<main class="wrap" style="padding-top:18px;padding-bottom:40px">
  <div class="center-card" style="margin-top:2vh" id="box"><div class="card"><p class="muted">Waa la hubinayaa…</p></div></div>
</main>
<script>
(function () {
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const box = document.getElementById('box');
  const token = location.pathname.split('/').pop();
  fetch('/api/public/card/' + encodeURIComponent(token)).then(async (r) => {
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    box.innerHTML = `
      <div class="banner ${d.valid ? 'good' : 'bad'}"><b>${d.valid ? '✓ Kaarkan waa rasmi' : '✕ Kaarkan waa la joojiyay'}</b><br><span class="small">${esc(d.orgName)}</span></div>
      <div class="card">
        <div class="small muted">${esc(d.examTitle)} – ${esc(d.year)}</div>
        <div class="stat" style="margin:10px 0"><div class="l">Roll Number</div><div class="v mono">${esc(d.roll)}</div></div>
        <label class="f"><span>Magaca ardayga</span><div style="font-size:1.05rem;font-weight:700">${esc(d.name)}</div></label>
        <label class="f"><span>Magaca hooyada</span><div style="font-weight:600">${esc(d.mother)}</div></label>
        <label class="f"><span>Dugsiga</span><div style="font-weight:600">${esc(d.school)}</div></label>
        <label class="f"><span>Jinsiga</span><div style="font-weight:600">${esc(d.gender || '–')}</div></label>
        ${d.valid && d.released ? `<a class="btn primary block" href="/natiijo?roll=${encodeURIComponent(d.roll)}">Eeg natiijada imtixaanka</a>` : d.valid ? '<p class="small muted">Natiijada weli lama sii dayn.</p>' : ''}
      </div>`;
  }).catch((e) => {
    box.innerHTML = `<div class="banner bad"><b>Kaarka lama xaqiijin</b><br>${esc(e.message || 'Internet ma jiro.')}</div>`;
  });
})();
</script>
</body>
</html>
